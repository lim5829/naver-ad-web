name: 플레이스 순위 기록

on:
  schedule:
    # 한국시간 오전 8시~밤 10시, 2시간 간격 (cron은 UTC 기준)
    - cron: '7 1,3,5,7,9,11,13,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rank-log

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: rank-log
          path: log
      - run: node scripts/rank-log.mjs log
      - name: 기록 저장
        working-directory: log
        run: |
          git config user.name "rank-log"
          git config user.email "rank-log@users.noreply.github.com"
          git add rank-log.csv coords.json last-run.json
          git commit -m "순위 기록 [skip ci]"
          git push
