<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#03C75A" />
<title>플레이스 순위</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard-dynamic-subset.css" />
<style>
:root { --green:#03C75A; --green-dark:#02A84B; --green-soft:#E6F9EF; --bg:#F5F6FA; --card:#FFFFFF; --line:#E2E6EF; --text:#1B2130; --sub:#6B7488; --amber:#9A6700; --amber-soft:#FFF4D6; --red:#C8322B; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--text); font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,sans-serif; font-size:15px; line-height:1.45; }
main { max-width:640px; margin:0 auto; padding:16px 16px 48px; }
h1 { font-size:20px; font-weight:700; margin-bottom:12px; }
form { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; display:grid; gap:8px; }
.row { display:flex; gap:8px; }
input, select { width:100%; min-width:0; font:inherit; font-size:16px; color:var(--text); background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
input:focus, select:focus { outline:2px solid var(--green); outline-offset:-1px; border-color:var(--green); }
label { flex:1; min-width:0; display:grid; gap:4px; font-size:12px; color:var(--sub); }
button { font:inherit; font-weight:700; color:#fff; background:var(--green); border:0; border-radius:8px; padding:10px 16px; cursor:pointer; flex:none; }
button:hover { background:var(--green-dark); }
button:disabled { background:#A9B2C3; cursor:default; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.chip { font-size:13px; font-weight:500; color:var(--text); background:var(--card); border:1px solid var(--line); padding:5px 10px; border-radius:999px; }
.chip:hover { background:var(--green-soft); }
.summary { margin-top:14px; padding:12px 14px; border-radius:12px; background:var(--green-soft); }
.summary.miss { background:var(--amber-soft); }
.summary strong { display:block; font-size:18px; }
.meta { font-size:13px; color:var(--sub); margin-top:2px; }
.bar { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:16px 0 8px; font-size:13px; color:var(--sub); }
.bar label { display:flex; flex:none; align-items:center; gap:6px; font-size:13px; cursor:pointer; }
.bar input { width:auto; }
ol { list-style:none; display:grid; gap:6px; }
li a { display:flex; gap:12px; align-items:center; padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:10px; color:inherit; text-decoration:none; }
li a:hover { border-color:var(--green); }
li.mine a { border:2px solid var(--green); background:var(--green-soft); }
.rank { flex:none; width:32px; text-align:center; font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
.ad-tag { flex:none; width:32px; text-align:center; font-size:12px; font-weight:700; color:var(--amber); }
.body { min-width:0; flex:1; }
.name { font-weight:700; overflow-wrap:anywhere; }
.cat { font-weight:400; font-size:13px; color:var(--sub); margin-left:4px; }
.line { font-size:13px; color:var(--sub); overflow-wrap:anywhere; }
.nums { font-variant-numeric:tabular-nums; }
.state { margin-top:16px; padding:16px; background:var(--card); border:1px solid var(--line); border-radius:12px; color:var(--sub); text-align:center; }
.state.err { color:var(--red); text-align:left; }
details { margin-top:8px; color:var(--sub); font-size:12px; }
pre { white-space:pre-wrap; overflow-wrap:anywhere; margin-top:6px; }
.note { margin-top:14px; font-size:12px; color:var(--sub); }
</style>
</head>
<body>
<main>
  <h1>플레이스 순위</h1>
  <form id="form">
    <div class="row">
      <input id="q" type="search" placeholder="키워드 (예: 양양카페)" aria-label="키워드" enterkeyhint="search" required />
      <button id="go" type="submit">조회</button>
    </div>
    <div class="row">
      <label>내 업체
        <input id="mine" type="text" value="달파도" />
      </label>
      <label>기기
        <select id="device">
          <option value="mobile">모바일</option>
          <option value="pc">PC</option>
        </select>
      </label>
      <label>검색 위치
        <select id="loc">
          <option value="128.66,38.05">양양</option>
          <option value="126.978,37.566">서울</option>
          <option value="127.728,37.881">춘천</option>
          <option value="128.876,37.752">강릉</option>
        </select>
      </label>
    </div>
  </form>
  <div class="chips" id="recent"></div>
  <div id="out"></div>
  <p class="note">네이버지도 목록의 첫 화면(보통 50곳 안팎) 기준입니다. 검색 위치와 시간에 따라 순위가 달라지고, 같은 조건은 1분간 저장된 결과를 보여줍니다. 광고는 돌아가며 노출되므로 한 번 조회에 없어도 집행이 안 된다는 뜻은 아닙니다.</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('placeRank.' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('placeRank.' + k, JSON.stringify(v)); } catch {} },
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const num = (n) => n === null || n === undefined ? null : n.toLocaleString('ko-KR');
const norm = (s) => String(s || '').replace(/\s+/g, '').toLowerCase();
let last = null;

function row(p, label, mine) {
  const nums = [
    p.score ? `★${p.score}` : null,
    p.visitorReviews !== null ? `방문자 ${num(p.visitorReviews)}` : null,
    p.blogReviews !== null ? `블로그 ${num(p.blogReviews)}` : null,
    p.saves !== null ? `저장 ${num(p.saves)}` : null,
  ].filter(Boolean).join(' · ');
  return `<li class="${mine ? 'mine' : ''}"><a href="https://map.naver.com/p/entry/place/${encodeURIComponent(p.id)}" target="_blank" rel="noopener">
    ${label}
    <div class="body">
      <div class="name">${esc(p.name)}<span class="cat">${esc(p.category)}</span></div>
      ${nums ? `<div class="line nums">${nums}</div>` : ''}
      ${p.address ? `<div class="line">${esc(p.address)}</div>` : ''}
    </div>
  </a></li>`;
}

function render() {
  if (!last) return;
  const mine = norm($('mine').value);
  const isMine = (p) => mine && norm(p.name).includes(mine);
  const { organic, ads, total, usedFallback, query, checkedAt, device, source, hasAdList, adTotal } = last;
  const myAd = ads.findIndex(isMine);
  const idx = organic.findIndex(isMine);
  const showAds = store.get('showAds', false);
  const time = new Date(checkedAt).toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' });
  const shown = total ? `전체 ${num(total)}곳 중 ${organic.length}곳` : `${organic.length}곳`;
  const adCount = adTotal && adTotal > ads.length ? `네이버 표기 ${num(adTotal)}개 중 ${ads.length}개만 수신` : `수신 ${ads.length}개`;
  const adLine = !mine ? '' : myAd >= 0
    ? `내 광고: 광고 ${myAd + 1}번째 노출 (${adCount})`
    : hasAdList ? `내 광고: 이번 조회에는 없음 (${adCount})` : '내 광고: 이번 응답에 광고 목록이 없어 확인 불가';
  const fallback = device !== source ? ' · 모바일 데이터를 못 읽어 PC 기준' : '';
  const summary = !mine ? '' : idx >= 0
    ? `<div class="summary"><strong>${esc($('mine').value)} ${idx + 1}위</strong><div class="meta">“${esc(query)}” 광고 제외 · ${time} 기준${fallback}</div><div class="meta">${adLine}</div></div>`
    : `<div class="summary miss"><strong>${esc($('mine').value)} 순위 밖</strong><div class="meta">“${esc(query)}” 상위 ${organic.length}곳 안에 없습니다 · ${time} 기준${fallback}</div><div class="meta">${adLine}</div></div>`;
  $('out').innerHTML = `${summary}
    <div class="bar"><span>${shown}${usedFallback ? ' · 순서 정확도 낮음' : ''}</span>
      ${ads.length ? `<label><input type="checkbox" id="showAds" ${showAds ? 'checked' : ''} />광고 ${ads.length}개 보기</label>` : ''}
    </div>
    ${showAds && ads.length ? `<ol style="margin-bottom:6px">${ads.map((p) => row(p, '<span class="ad-tag">광고</span>', isMine(p))).join('')}</ol>` : ''}
    <ol>${organic.map((p, i) => row(p, `<span class="rank">${i + 1}</span>`, isMine(p))).join('')}</ol>
    <details><summary>조회 정보</summary><pre>${esc(`기기: ${source} · 목록: ${last.kind} · 좌표: ${last.x}, ${last.y}\n네이버 적용 조건: ${last.appliedArgs || '확인 불가'}`)}</pre></details>`;
  const box = $('showAds');
  if (box) box.onchange = () => { store.set('showAds', box.checked); render(); };
}

function renderRecent() {
  $('recent').innerHTML = store.get('recent', []).map((k) => `<button type="button" class="chip" data-k="${esc(k)}">${esc(k)}</button>`).join('');
}

async function search(q) {
  const [x, y] = $('loc').value.split(',');
  const device = $('device').value;
  $('go').disabled = true;
  last = null;
  $('out').innerHTML = '<div class="state">조회 중…</div>';
  try {
    const res = await fetch(`/api/place-rank?${new URLSearchParams({ q, x, y, device })}`);
    const data = await res.json().catch(() => ({ error: `서버 응답을 읽지 못했습니다 (${res.status}).` }));
    if (!res.ok || data.error) {
      $('out').innerHTML = `<div class="state err">${esc(data.error)}${data.debug ? `<details><summary>원인 정보</summary><pre>${esc(JSON.stringify(data.debug, null, 1))}</pre></details>` : ''}</div>`;
      return;
    }
    last = data;
    store.set('recent', [q, ...store.get('recent', []).filter((k) => k !== q)].slice(0, 8));
    renderRecent();
    render();
  } catch (e) {
    $('out').innerHTML = `<div class="state err">연결에 실패했습니다. 다시 시도해 주세요.</div>`;
  } finally {
    $('go').disabled = false;
  }
}

$('mine').value = store.get('mine', '달파도');
$('loc').value = store.get('loc', $('loc').value);
$('device').value = store.get('device', 'mobile');
renderRecent();
$('form').onsubmit = (e) => { e.preventDefault(); const q = $('q').value.trim(); if (q) search(q); };
$('mine').oninput = () => { store.set('mine', $('mine').value); render(); };
$('loc').onchange = () => { store.set('loc', $('loc').value); const q = $('q').value.trim(); if (q) search(q); };
$('device').onchange = () => { store.set('device', $('device').value); const q = $('q').value.trim(); if (q) search(q); };
$('recent').onclick = (e) => { const k = e.target.dataset.k; if (k) { $('q').value = k; search(k); } };
</script>
</body>
</html>
